<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vesperGradGov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glowGov" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Geospatial Atmospheric Orbit Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#vesperGradGov)" stroke-width="2.5" stroke-dasharray="7 4" opacity="0.65" />
  
  <!-- Dynamic Atmospheric Airflow & Dispersion Wings -->
  <path d="M 22 68 C 28 42, 52 30, 78 22 C 62 44, 48 58, 22 68 Z" fill="url(#vesperGradGov)" filter="url(#glowGov)" />
  <path d="M 28 76 C 38 60, 58 48, 82 40 C 68 58, 52 70, 28 76 Z" fill="url(#vesperGradGov)" opacity="0.75" />
  
  <!-- Central Multimodal Optical Eye / AI Core -->
  <circle cx="50" cy="48" r="8.5" fill="#0b1329" stroke="url(#vesperGradGov)" stroke-width="2.5" />
  <circle cx="50" cy="48" r="3.5" fill="#38bdf8" />
  
  <!-- Satellite Telemetry Beacons -->
  <circle cx="78" cy="22" r="3.5" fill="#10b981" />
  <circle cx="22" cy="68" r="2.5" fill="#38bdf8" />
</svg>
