version: '3.8'

# 100% Open-Source Infrastructure Stack for VesperAero Server
# Includes: Node.js Express API, Redis Cache, PostgreSQL Database, MinIO Object Storage

services:
  # 1. VesperAero Backend API & Environmental Forensics Engine (Open-Source Node.js/Express)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vesperaero_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY}
      - JUDGE_SECRET_TOKEN=${JUDGE_SECRET_TOKEN:-vesper-eval-2026}
      - DAILY_GEMINI_CAP=${DAILY_GEMINI_CAP:-1000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
      # Open-Source PostgreSQL Connection
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-vesperaero_secure_2026}@postgres:5432/${POSTGRES_DB:-vesperaero}
      # Open-Source Redis Cache
      - REDIS_URL=redis://redis:6379
      # Open-Source MinIO S3 Object Storage Bucket
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET_NAME=vesperaero-evidence
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin_secure_2026}
    volumes:
      - vesperaero_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/health']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vesperaero_net

  # 2. Redis - 100% Open-Source In-Memory Caching & Rate Limiting Engine
  redis:
    image: redis:7-alpine
    container_name: vesperaero_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vesperaero_net

  # 3. PostgreSQL - 100% Open-Source Relational Database (ACID Compliance)
  postgres:
    image: postgres:16-alpine
    container_name: vesperaero_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vesperaero_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vesperaero}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vesperaero_net

  # 4. MinIO - 100% Open-Source S3-Compatible High-Performance Object Storage
  minio:
    image: minio/minio:latest
    container_name: vesperaero_minio
    restart: unless-stopped
    ports:
      - '9000:9000' # S3 API Gateway
      - '9001:9001' # Web Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_secure_2026}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vesperaero_net

  # 5. MinIO Auto-Provisioner - Initializes 'vesperaero-evidence' Bucket
  minio_init:
    image: minio/mc:latest
    container_name: vesperaero_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin_secure_2026;
      /usr/bin/mc mb myminio/vesperaero-evidence --ignore-existing;
      /usr/bin/mc anonymous set download myminio/vesperaero-evidence;
      exit 0;
      "
    networks:
      - vesperaero_net

volumes:
  vesperaero_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  vesperaero_net:
    driver: bridge
